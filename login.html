<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in — Hearth Foundation</title>
<meta name="description" content="Sign in to the Hearth Foundation donor portal or staff console.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0D3B2E">

<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">

    <a class="auth-card__brand" href="index.html" aria-label="Hearth Foundation home">
      <span class="brand-mark">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <path fill="#F5B93F" d="M32 13c-1.6 6.4-5.8 9.3-9.4 12.6-3.5 3.2-5.6 6.5-5.6 10.4A15 15 0 0 0 32 51a15 15 0 0 0 15-15c0-3.9-2.1-7.2-5.6-10.4C37.8 22.3 33.6 19.4 32 13Z"/>
          <path fill="#FBF7F1" opacity=".92" d="M32 25.5c-1 3.6-3.2 5.2-5.2 7.1-1.9 1.8-3 3.5-3 5.7A8.2 8.2 0 0 0 32 46.4a8.2 8.2 0 0 0 8.2-8.1c0-2.2-1.1-3.9-3-5.7-2-1.9-4.2-3.5-5.2-7.1Z"/>
        </svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">Hearth</span>
        <span class="brand-tag">Foundation</span>
      </span>
    </a>

    <h1>Sign in</h1>
    <p>One place for your giving history, your receipts, and the work your money paid for.</p>

    <form class="auth-fields" data-auth-form novalidate>
      <div class="role-pick" role="radiogroup" aria-label="Choose a dashboard">
        <label class="role-opt" data-who="marcus.bell@hearthfoundation.org">
          <input type="radio" name="role" value="admin" checked>
          <i class="bi bi-clipboard-data"></i>
          <b>Staff console</b>
          <span>Income, programmes, approvals.</span>
        </label>
        <label class="role-opt" data-who="ada.lovelace@example.org">
          <input type="radio" name="role" value="donor">
          <i class="bi bi-heart"></i>
          <b>Donor portal</b>
          <span>Gifts, receipts, impact.</span>
        </label>
      </div>

      <div class="field">
        <label for="authEmail">Email address</label>
        <input class="form-control" type="email" id="authEmail" name="email"
               autocomplete="username" placeholder="you@example.org" required>
      </div>

      <div class="field">
        <label for="authPassword">Password</label>
        <input class="form-control" type="password" id="authPassword" name="password"
               autocomplete="current-password" placeholder="••••••••" required>
        <p class="form-hint">Any four characters work. This is a demo — nothing is sent anywhere.</p>
      </div>

      <p class="auth-error" data-auth-error role="alert" aria-live="polite"></p>

      <button class="btn btn--block" type="submit" data-auth-submit>
        <span class="btn__label"><i class="bi bi-box-arrow-in-right"></i> Continue</span>
      </button>
    </form>

    <p class="auth-foot">
      New here? <a class="link-underline" href="signup.html">Create a free account</a><br>
      <a href="index.html"><i class="bi bi-arrow-left"></i> Back to hearthfoundation.org</a>
    </p>

  </div>
</div>

<script src="js/dashboard-data.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
